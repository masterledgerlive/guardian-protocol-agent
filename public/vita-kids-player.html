<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KIDS — VITA closed-garden player</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1b2a4a;
      --sky: #7ec8e3;
      --sun: #ffd166;
      --leaf: #2a9d8f;
      --paper: #fff8ef;
      --coral: #e07a5f;
      --display: "Nunito", sans-serif;
      --mono: "IBM Plex Mono", monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      color: var(--ink);
      font-family: var(--mono);
      background:
        radial-gradient(900px 420px at 90% -10%, rgba(255, 209, 102, .45), transparent 55%),
        radial-gradient(700px 380px at 0% 0%, rgba(126, 200, 227, .4), transparent 50%),
        linear-gradient(165deg, #fff8ef 0%, #e8f6fb 55%, #d9efe8 100%);
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem 1rem 2rem;
    }
    h1 {
      font-family: var(--display);
      font-size: clamp(2rem, 6vw, 3.2rem);
      margin: 0 0 .25rem;
      letter-spacing: -.03em;
    }
    .lede {
      margin: 0 0 1rem;
      color: #3d5566;
      font-size: .85rem;
      max-width: 42rem;
    }
    .grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: 1fr;
    }
    @media (min-width: 900px) {
      .grid { grid-template-columns: minmax(0, 1.45fr) minmax(240px, .8fr); }
    }
    .screen {
      background: #0b1220;
      border-radius: 18px;
      overflow: hidden;
      border: 3px solid var(--ink);
      min-height: 220px;
      position: relative;
    }
    .screen iframe, .screen .yt {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      display: block;
      background: #000;
    }
    .endcard {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      text-align: center;
      color: #fff;
      background: rgba(11, 18, 32, .92);
      padding: 1.5rem;
      font-family: var(--display);
    }
    .endcard.show { display: grid; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: .45rem;
      margin: .75rem 0 0;
    }
    button {
      font-family: var(--display);
      font-weight: 800;
      border: 2px solid var(--ink);
      background: var(--sun);
      color: var(--ink);
      padding: .45rem .8rem;
      border-radius: 999px;
      cursor: pointer;
    }
    button.ghost { background: transparent; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    .now {
      font-family: var(--display);
      font-weight: 800;
      font-size: 1.05rem;
      margin: .6rem 0 .2rem;
    }
    .count { color: #3d5566; font-size: .78rem; }
    .list {
      background: rgba(255,255,255,.72);
      border: 2px solid rgba(27,42,74,.16);
      border-radius: 16px;
      max-height: min(70vh, 640px);
      overflow: auto;
      padding: .4rem;
    }
    .row {
      display: grid;
      grid-template-columns: 2.2rem 1fr;
      gap: .4rem;
      padding: .45rem .5rem;
      border-radius: 10px;
      cursor: pointer;
      font-size: .78rem;
      line-height: 1.25;
    }
    .row:hover { background: rgba(126, 200, 227, .28); }
    .row.on { background: var(--leaf); color: #fff; }
    .row span.n { font-family: var(--display); font-weight: 800; }
    .pill {
      display: inline-block;
      background: var(--leaf);
      color: #fff;
      font-family: var(--display);
      font-weight: 800;
      font-size: .72rem;
      padding: .2rem .55rem;
      border-radius: 999px;
      margin-bottom: .55rem;
    }
    a { color: #1a6b8a; }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="pill">closed garden · KIDS directory only</span>
    <h1>KIDS player</h1>
    <p class="lede">
      Only the URLs in our KIDS directory play here. No YouTube search, no other
      channels, no recommended videos. Next and previous stay inside this list.
    </p>
    <div class="grid">
      <div>
        <div class="screen">
          <div id="player" class="yt"></div>
          <div class="endcard" id="endCard">
            <div>
              <div>End of KIDS list</div>
              <p style="opacity:.8;font-family:var(--mono);font-size:.8rem">Replay from the start, or pick a title on the right.</p>
            </div>
          </div>
        </div>
        <div class="now" id="nowTitle">Loading KIDS directory…</div>
        <div class="count" id="nowCount"></div>
        <div class="controls">
          <button type="button" id="btnPrev">◀ Prev</button>
          <button type="button" id="btnPlay">Play</button>
          <button type="button" id="btnNext">Next ▶</button>
          <button type="button" id="btnReplay" class="ghost">Replay list</button>
        </div>
      </div>
      <aside>
        <div class="list" id="list" aria-label="KIDS playlist"></div>
      </aside>
    </div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const dirId = (q.get("dir") || q.get("playlist") || "kids").toLowerCase();
    const startN = Math.max(1, Number(q.get("i") || q.get("n") || 1) || 1);
    let items = [];
    let index = 0;
    let ytPlayer = null;
    let apiReady = false;
    let pendingPlay = false;

    const el = (id) => document.getElementById(id);

    function clip(s, n) {
      const t = String(s || "");
      return t.length <= n ? t : t.slice(0, n - 1) + "…";
    }

    function renderList() {
      const box = el("list");
      box.innerHTML = items.map((it, i) =>
        "<div class='row" + (i === index ? " on" : "") + "' data-i='" + i + "'>" +
        "<span class='n'>" + String(it.n).padStart(2, "0") + "</span>" +
        "<span>" + clip(it.title, 72) + "</span></div>"
      ).join("");
      box.querySelectorAll(".row").forEach((row) => {
        row.addEventListener("click", () => playAt(Number(row.dataset.i), true));
      });
    }

    function setNow() {
      const it = items[index];
      if (!it) return;
      el("nowTitle").textContent = it.title;
      el("nowCount").textContent = "#" + it.n + " / " + items.length + " · closed garden";
      el("endCard").classList.remove("show");
      renderList();
      const row = el("list").querySelector(".row.on");
      if (row) row.scrollIntoView({ block: "nearest" });
    }

    function playAt(i, autoplay) {
      if (!items.length) return;
      index = Math.max(0, Math.min(items.length - 1, i));
      setNow();
      const it = items[index];
      const start = autoplay !== false;
      if (ytPlayer && typeof ytPlayer.loadVideoById === "function") {
        if (start) ytPlayer.loadVideoById({ videoId: it.videoId });
        else ytPlayer.cueVideoById({ videoId: it.videoId });
        return;
      }
      pendingPlay = start;
      if (apiReady) mountPlayer();
    }

    function next() { playAt(index + 1, true); }
    function prev() { playAt(index - 1, true); }

    function onEnded() {
      if (index + 1 < items.length) {
        playAt(index + 1, true);
        return;
      }
      el("endCard").classList.add("show");
      if (ytPlayer && typeof ytPlayer.stopVideo === "function") ytPlayer.stopVideo();
    }

    function mountPlayer() {
      if (!items.length || !window.YT || !window.YT.Player) return;
      const it = items[index];
      if (ytPlayer) {
        playAt(index, pendingPlay);
        return;
      }
      ytPlayer = new YT.Player("player", {
        host: "https://www.youtube-nocookie.com",
        videoId: it.videoId,
        playerVars: {
          rel: 0,
          modestbranding: 1,
          playsinline: 1,
          iv_load_policy: 3,
          fs: 1,
          controls: 1,
          disablekb: 0,
          autoplay: pendingPlay ? 1 : 0,
          origin: location.origin,
        },
        events: {
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.ENDED) onEnded();
          },
        },
      });
    }

    window.onYouTubeIframeAPIReady = function () {
      apiReady = true;
      if (items.length) mountPlayer();
    };

    el("btnNext").addEventListener("click", next);
    el("btnPrev").addEventListener("click", prev);
    el("btnPlay").addEventListener("click", () => playAt(index, true));
    el("btnReplay").addEventListener("click", () => playAt(0, true));

    (async function boot() {
      const res = await fetch("/vita/url-dir/" + encodeURIComponent(dirId));
      const data = await res.json();
      if (!data?.ok || !data.dir?.items?.length) {
        el("nowTitle").textContent = "Could not load KIDS directory";
        el("nowCount").textContent = data?.error || res.status;
        return;
      }
      items = data.dir.items;
      index = Math.max(0, items.findIndex((it) => it.n === startN));
      if (index < 0) index = 0;
      pendingPlay = true;
      setNow();
      const tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(tag);
      if (window.YT && window.YT.Player) {
        apiReady = true;
        mountPlayer();
      }
    })().catch((e) => {
      el("nowTitle").textContent = "Load failed";
      el("nowCount").textContent = String(e?.message || e);
    });
  </script>
</body>
</html>
